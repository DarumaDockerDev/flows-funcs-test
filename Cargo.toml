[package]
name = "sms"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
path = "src/main.rs"
name = "sms-cli"

[dependencies]
http_req_wasi = { version = "0.11" }
webhook-flows = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1", features = ["full"] }
flowsnet-platform-sdk = "0.1.5"
log = "0.4.20"
chrono = "0.4.31"
twilio_wasi = "1"
tencentcloud-sdk-sms-wasi = "0.2"
whatsapp-cloud-api = { version = "0.5.3", default-features = false, features = [
    "rustls",
] }
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[patch.crates-io]
tokio = { git = "https://github.com/second-state/wasi_tokio.git", branch = "v1.36.x" }
mio = { git = "https://github.com/second-state/wasi_mio.git", branch = "v0.8.x" }
socket2 = { git = "https://github.com/second-state/socket2.git", branch = "v0.5.x" }
hyper = { git = "https://github.com/second-state/wasi_hyper.git", branch = "v0.14.x" }
reqwest = { git = "https://github.com/second-state/wasi_reqwest.git", branch = "0.11.x" }
whatsapp-cloud-api = { git = "https://github.com/sajuthankappan/whatsapp-cloud-api-rs.git" }
